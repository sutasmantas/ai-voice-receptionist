name: Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: these jobs only read the repository and run tests.
# Without this block the workflow inherits the repository default token
# scope, which can be read-write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        sha256sum -c vendor/leaddock-1.1.0.sha256
        python -m pip install vendor/deliveryguard-0.2.0-py3-none-any.whl
        python -m pip install vendor/leaddock-1.1.0-py3-none-any.whl
        python -m pip install -e . pytest pytest-asyncio pytest-cov ruff mypy build twine httpx httpx2

    - name: Static checks
      run: |
        ruff check src tests
        ruff format --check src tests
        mypy -p firstring

    - name: Tests and coverage
      run: pytest -q --cov=firstring --cov-report=term-missing

    - name: Deterministic audio harness
      run: python scripts/run_v0_audio_gate.py

    - name: Package
      run: |
        python -m build
        twine check dist/*
