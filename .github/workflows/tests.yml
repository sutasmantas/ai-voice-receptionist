name: Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: these jobs only read the repository and run tests.
# Without this block the workflow inherits the repository default token
# scope, which can be read-write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install vendor/deliveryguard-0.2.0-py3-none-any.whl
        python -m pip install -e . pytest pytest-asyncio pytest-cov ruff mypy build twine httpx httpx2

    - name: Static checks
      run: |
        ruff check src tests
        ruff format --check src tests
        mypy -p firstring

    - name: Tests and coverage
      run: pytest -q --cov=firstring --cov-report=term-missing

    - name: Package
      run: |
        python -m build
        twine check dist/*
