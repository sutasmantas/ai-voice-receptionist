[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firstring"
version = "0.1.0"
description = "Simulator-first voice receptionist with grounded booking and durable handoff"
readme = "README.md"
requires-python = ">=3.10, <3.15"

dependencies = [
    "deliveryguard==0.2.0",
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "livekit-agents==1.6.8",
    "livekit-plugins-ai-coustics~=0.2",
    "python-dotenv==1.2.2",
    "rapidfuzz==3.14.5",
    "tzdata==2026.3",
    "uvicorn==0.52.1",
]

[project.scripts]
firstring-demo = "firstring.demo:main"

[dependency-groups]
dev = [
    "build==1.5.0",
    "httpx==0.28.1",
    "httpx2==2.9.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "twine==7.0.0",
]
eval = [
    "autoevals[inspect]==0.3.0",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.uv.sources]
autoevals = { path = "vendor/autoevals-0.3.0-py3-none-any.whl" }
deliveryguard = { path = "vendor/deliveryguard-0.2.0-py3-none-any.whl" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
firstring = ["templates/*.html", "static/*.css", "static/*.js", "py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["firstring"]

[tool.coverage.report]
fail_under = 85
# inspect_eval.py drives the Inspect AI harness. inspect_ai is not a declared
# dependency and CI does not install it, so the module cannot be exercised
# here. Measuring it would report a coverage number this workflow cannot earn.
omit = ["*/firstring/inspect_eval.py"]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
packages = ["firstring"]

[[tool.mypy.overrides]]
module = ["deliveryguard.*", "inspect_ai.*", "proofgrid.*", "rapidfuzz.*"]
ignore_missing_imports = true

# inspect_ai's @solver and @task decorators are untyped, and mypy's strict mode
# treats a function wrapped by an untyped decorator as untyped too. The
# alternative is dropping strict mode for the whole package, which would lose
# far more than it buys.
[[tool.mypy.overrides]]
module = ["firstring.inspect_eval"]
disallow_untyped_decorators = false
